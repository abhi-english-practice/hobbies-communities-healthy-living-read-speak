.answer-area p{margin:5px 0 0}

 const userSentence=ss.built.map(i=>chunks[i]).join(' ');
 const hintHtml=ss.viShown?`<div class="vi-value">${esc(vi)}</div>`:`<div class="vi-placeholder">Hidden by default. Open it only when you need a translation.</div>`;
 const outputHtml=ss.built.length?ss.built.map(i=>`<button class="chunk selected" onclick="removeChunk(${i})" title="Return this chunk">${esc(chunks[i])}</button>`).join(''):`<span class="blank-callout">Tap the chunks below to build the original sentence.</span>`;
 const bankHtml=remaining.length?remaining.map(i=>`<button class="chunk" onclick="addChunk(${i})">${esc(chunks[i])}</button>`).join(''):`<span class="bank-empty">All chunks selected. Press Check to verify.</span>`;
 return `<section class="panel sentence-panel" aria-label="Sentence Builder">
  <div class="sentence-head"><div><div class="sentence-eyebrow">Sentence Builder · Speaking · Unit ${unit+1}</div><h2 class="sentence-title">Sentence ${sentIdx+1} <span class="muted">/ ${count}</span></h2><p class="sentence-desc">${esc(u.speaking.title)}</p></div><div class="jump-group"><label class="jump-label" for="sentenceJump">Go to sentence</label><select class="jump-select" id="sentenceJump" aria-label="Go to sentence" onchange="jumpSentence(this.value)">${u.speaking.sentences.map((_,i)=>`<option value="${i}" ${i===sentIdx?'selected':''}>${sentenceSession(i).done?'✓ ':''}Sentence ${i+1}</option>`).join('')}</select></div></div>
  ${audioBox('speaking')}<div class="progress-meta"><span>${complete} / ${count} sentences completed</span><span>${percent}%</span></div><div class="progress-track" role="progressbar" aria-valuenow="${complete}" aria-valuemin="0" aria-valuemax="${count}" aria-label="Sentence progress"><div class="progress-fill" style="width:${percent}%"></div></div>
  <div class="mode-strip"><button onclick="switchMode('chunks')" class="${mode==='chunks'?'active':''}">Build with chunks</button><button onclick="switchMode('type')" class="${mode==='type'?'active':''}">Type from memory</button><span class="mode-note">The original English sentence stays hidden.</span></div>
  <div class="vi-panel"><div class="vi-top"><span class="vi-label">VIETNAMESE HINT</span><button class="btn-subtle" aria-expanded="${ss.viShown}" onclick="toggleHint()">${ss.viShown?'Hide':'Show'} Vietnamese</button></div>${hintHtml}</div>
  ${mode==='chunks'?`<label class="practice-label">YOUR SENTENCE</label><div class="chunks selected-zone" aria-live="polite">${outputHtml}</div><label class="practice-label">CHUNK BANK</label><div class="chunks bank-zone">${bankHtml}</div>`:`<label class="practice-label" for="typed">YOUR SENTENCE</label><textarea id="typed" spellcheck="false" autocomplete="off" placeholder="Type the complete sentence from memory..." oninput="saveTyped()">${esc(ss.text)}</textarea>`}
  <div class="control-row"><div class="control-main"><button class="primary" onclick="checkSentence()">Check</button><button onclick="showSentenceHint()">Hint</button><button onclick="clearSentence()">Clear</button><button class="btn-reveal" onclick="toggleAnswer()">${ss.answerShown?'Hide answer':'Show answer'}</button></div><div class="control-nav"><button onclick="changeSent(-1)" ${sentIdx===0?'disabled':''}>← Prev</button><button onclick="changeSent(1)" ${sentIdx===count-1?'disabled':''}>Next →</button></div></div>
  <div class="sentence-feedback ${ss.feedbackType==='ok'?'feedback-ok':ss.feedbackType==='error'?'feedback-error':''}" id="sentenceFeedback" role="status">${esc(ss.feedback)}</div>
  ${ss.answerShown?`<div class="answer-area"><div class="answer-title">Original sentence · Sentence ${sentIdx+1}</div><p>${esc(s)}</p></div>`:''}
  <div class="sentence-separator"></div><div class="sentence-bottom"><span class="current-counter">${complete} of ${count} completed · Unit ${unit+1}</span><div class="row"><button class="btn-subtle" onclick="resetProgress()">Reset progress</button><button onclick="go('speaking')">Back to Speaking</button></div></div>
  </section>`;
}
function saveTyped(){const input=$('typed');if(input)sentenceSession().text=input.value;}
function switchMode(target){stopAllAudio();saveTyped();mode=target;sentenceSession().viShown=false;sentenceSession().answerShown=false;render();}
function changeSent(delta){stopAllAudio();saveTyped();sentIdx=Math.max(0,Math.min(current().speaking.sentences.length-1,sentIdx+delta));sentenceSession().answerShown=false;sentenceSession().viShown=false;render();}
function jumpSentence(raw){stopAllAudio();saveTyped();const i=Number(raw);if(Number.isInteger(i)&&i>=0&&i<current().speaking.sentences.length){sentIdx=i;sentenceSession().answerShown=false;sentenceSession().viShown=false;render();}}
function addChunk(i){const ss=sentenceSession(),arr=chunkify(current().speaking.sentences[sentIdx]);if(i>=0&&i<arr.length&&!ss.built.includes(i)){ss.built.push(i);ss.feedback='';ss.feedbackType='';render();}}
function removeChunk(i){const ss=sentenceSession();ss.built=ss.built.filter(v=>v!==i);ss.feedback='';ss.feedbackType='';render();}
function toggleHint(){const ss=sentenceSession();ss.viShown=!ss.viShown;render();}
function showSentenceHint(){const ss=sentenceSession();ss.viShown=true;render();}
function toggleAnswer(){saveTyped();const ss=sentenceSession();ss.answerShown=!ss.answerShown;render();}
function clearSentence(){const ss=sentenceSession();ss.built=[];ss.text='';ss.feedback='';ss.feedbackType='';ss.answerShown=false;render();}
function resetProgress(){stopAllAudio();for(let i=0;i<current().speaking.sentences.length;i++)sentenceSession(i).done=false;render();}
function normalise(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();}
function checkSentence(){
 saveTyped();const ss=sentenceSession(),source=current().speaking.sentences[sentIdx];
 const value=mode==='chunks'?ss.built.map(i=>chunkify(source)[i]).join(' '):ss.text;
 if(normalise(value)===normalise(source)){
  ss.done=true;ss.feedback='✓ Correct! This matches the original sentence.';ss.feedbackType='ok';
 }else if(!normalise(value)){
  ss.feedback='Choose chunks or type your answer before checking.';ss.feedbackType='error';
 }else{
  ss.feedback='The order does not match the original sentence yet. Try again.';ss.feedbackType='error';
 }
 render();
}
render();
</script>
</body>
</html>
